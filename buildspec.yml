version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo Installing dependencies...

  pre_build:
    commands:
      - echo Pre-build phase started...

  build:
    commands:
      - echo Build started on $(date)
      - mvn clean install

  post_build:
    commands:
      - echo Build completed on $(date)

artifacts:
  files:
    - target/*.jar
